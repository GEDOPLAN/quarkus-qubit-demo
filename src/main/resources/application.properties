# H2 in-memory database - no Docker/Dev Services required
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:qubitdemo;DB_CLOSE_DELAY=-1
quarkus.datasource.devservices.enabled=false

quarkus.hibernate-orm.schema-management.strategy=drop-and-create
quarkus.hibernate-orm.sql-load-script=import.sql

# Silences Qubit's false-positive "no terminal operation" warning, which is
# emitted for every lambda while scanning the synthetic $deserializeLambda$
# bridge method javac generates - not the real call site.
quarkus.log.category."io.quarkiverse.qubit.deployment.analysis.InvokeDynamicScanner".level=ERROR
